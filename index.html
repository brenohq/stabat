<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>stabat · Repertório da banda</title>
<meta name="description" content="Arranjos da banda para estudar em casa: ouça a banda inteira e pratique a sua parte.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/stabat.css">
</head>
<body>
<header class="topbar"><span class="brand-slot"></span></header>
<div class="hero"><div class="in">
  <h1>Repertório da banda</h1>
  <p>Escolha um arranjo, ouça a banda inteira e estude a sua parte em casa.</p>
</div></div>
<div class="mine">
  <div class="card" id="mineCard">
    <div class="ic" data-icon="person"></div>
    <div class="txt"><b>Qual é a sua parte?</b><span>Fica salvo neste aparelho. Cada arranjo ganha um atalho direto para ela.</span></div>
    <select id="mypart" aria-label="Minha parte"><option value="">— escolher —</option></select>
  </div>
</div>
<div class="list">
  <div class="list-head">
    <h2>Arranjos publicados</h2>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar arranjo…" aria-label="Buscar arranjo" autocomplete="off"></label>
  </div>
  <div class="cards" id="cards"></div>
  <p class="empty" id="empty" hidden>Nenhum arranjo encontrado.</p>
</div>
<p class="foot">Áudio gerado com Muse Sounds no MuseScore Studio.</p>
<script src="assets/app.js"></script>
<script>
function cover(a) {
  const [h1, h2] = a.hue || [40, 220];
  let lines = ""; for (let i = 0; i < 5; i++) lines += `<line x1="0" x2="400" y1="${28 + i * 9}" y2="${28 + i * 9}" stroke="rgba(255,255,255,.18)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 400 96" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g-${a.id}" x1="0" x2="1"><stop offset="0" stop-color="hsl(${h1} 55% 42%)"/><stop offset="1" stop-color="hsl(${h2} 50% 30%)"/></linearGradient></defs><rect width="400" height="96" fill="url(#g-${a.id})"/>${lines}</svg>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
(async () => {
  const idx = await Stabat.index();
  // lista de partes: união das partes de todos os arranjos, na ordem em que aparecem
  const metas = await Promise.all(idx.map(a => Stabat.meta(a.id)));
  const all = [];
  for (const m of metas) for (const p of m.parts) if (!all.some(x => x.id === p.id)) all.push(p);
  const sel = document.getElementById("mypart");
  sel.innerHTML += all.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  const saved = Stabat.getMyPart(); if (saved && all.some(p => p.id === saved.id)) sel.value = saved.id;
  const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const q = document.getElementById("q");
  function draw() {
    const my = all.find(p => p.id === sel.value);
    document.getElementById("mineCard").classList.toggle("attention", !my);
    const terms = norm(q.value).split(/\s+/).filter(Boolean);
    const shown = idx.map((a, i) => [a, i]).filter(([a]) => { const h = norm(`${a.title} ${a.subtitle}`); return terms.every(t => h.includes(t)); });
    document.getElementById("empty").hidden = shown.length > 0;
    document.getElementById("cards").innerHTML = shown.map(([a, i]) => {
      const has = my && metas[i].parts.some(p => p.id === my.id);
      return `<article class="arr card">
        <div class="cover">${cover(a)}<div class="ttl">${esc(a.title)}</div></div>
        <div class="body">
          <a class="main sub" href="arranjo.html?id=${a.id}">${esc(a.subtitle)}</a>
          <div class="chips"><span class="chip">${a.tempo} bpm</span><span class="chip">${a.time}</span><span class="chip">${a.measures} compassos</span><span class="chip">${Stabat.fmt(a.duration)}</span></div>
          <div class="actions">${has
            ? `<a class="btn primary" href="parte.html?id=${a.id}&part=${my.id}" data-mypart="${my.id}" data-mypart-name="${esc(my.name)}">Estudar ${esc(Stabat.shortName(my.name))}</a>`
            : `<span class="open">Abrir arranjo ${Icons.arrow}</span>`}</div>
        </div>
      </article>`;
    }).join("");
  }
  q.oninput = draw;
  sel.onchange = () => { const p = all.find(x => x.id === sel.value); Stabat.setMyPart(p ? { id: p.id, name: p.name } : null); draw(); };
  draw();
})();
</script>
</body>
</html>
